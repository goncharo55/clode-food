# スクレイパーを12時間ごとに自動実行する。
#
# 動作にはリポジトリのSettings > Secrets and variables > Actions に
# ANTHROPIC_API_KEY, INGEST_SECRET, INGEST_API_URL の登録が必要（docs/ops-notes.md参照）。
# 未登録の場合、実行はスキップされずに失敗するのでActionsタブで確認すること。
#
name: Scrape limited-time campaigns

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */12 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: scraper
        run: pip install -r requirements.txt
      - name: Install Playwright browser
        working-directory: scraper
        run: playwright install --with-deps chromium
      - name: Run scraper
        working-directory: scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
        run: python main.py 10
